<div class="view-header d-flex justify-content-between align-items-center">
  <h1>Genres</h1>
  <button class="btn btn-sm btn-outline-primary" id="addGenreBtn" data-bs-toggle="modal" data-bs-target="#addGenreModal">Add Genre</button>
</div>
<div class="card card-shadow">
  <div class="card-body">
    <ul class="list-group list-group-flush" id="genresList">
      <li class="list-group-item text-center">Loading...</li>
    </ul>
  </div>
</div>
<script>
  (function() {
    const user = UserService.getCurrentUser();
    if (user && user.role === Constants.ADMIN_ROLE) {
      document.getElementById('addGenreBtn').style.display = 'inline-block';
    }
    
    RestClient.get('genres', function(response) {
      const list = document.getElementById('genresList');
      if (response.success && response.data && response.data.length > 0) {
        list.innerHTML = response.data.map(genre => 
          `<li class="list-group-item d-flex justify-content-between align-items-center">
            ${genre.name || ''} 
            <span class="badge bg-secondary">${genre.book_count || 0}</span>
          </li>`
        ).join('');
      } else {
        list.innerHTML = '<li class="list-group-item text-center">No genres found</li>';
      }
    }, function() {
      document.getElementById('genresList').innerHTML = '<li class="list-group-item text-center text-danger">Failed to load genres</li>';
    });
    
    // Show/hide admin buttons based on user role
    const user = UserService.getCurrentUser();
    if (!user || user.role !== Constants.ADMIN_ROLE) {
      document.getElementById('addGenreBtn').style.display = 'none';
    }
  })();
</script>

<!-- Add Genre Modal -->
<div class="modal fade" id="addGenreModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add New Genre</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="addGenreForm">
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" name="name" required>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="saveGenre()">Save Genre</button>
      </div>
    </div>
  </div>
</div>

<script>
function saveGenre() {
  const form = document.getElementById('addGenreForm');
  const formData = new FormData(form);
  const data = Object.fromEntries(formData);
  
  RestClient.post('genres', data, function(response) {
    if (response.success) {
      toastr.success('Genre added successfully!');
      $('#addGenreModal').modal('hide');
      form.reset();
      window.location.reload();
    } else {
      toastr.error(response.message || 'Failed to add genre');
    }
  }, function(error) {
    toastr.error('Error adding genre');
  });
}
</script>

<div class="view-header">
  <h1>Users</h1>
  <a href="#/register" class="btn btn-sm btn-outline-primary admin-only" id="addUserBtn" style="display: none;">Register User</a>
</div>
<div class="card card-shadow">
  <div class="card-body">
    <div class="table-responsive">
      <table class="table align-middle">
        <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th></th></tr></thead>
        <tbody id="usersTableBody">
          <tr><td colspan="5" class="text-center">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<script>
  (function() {
    const user = UserService.getCurrentUser();
    if (!user || user.role !== Constants.ADMIN_ROLE) {
      window.location.hash = '#/dashboard';
      return;
    }
    document.getElementById('addUserBtn').style.display = 'inline-block';
    
    RestClient.get('users', function(response) {
      const tbody = document.getElementById('usersTableBody');
      if (response.success && response.data && response.data.length > 0) {
        tbody.innerHTML = response.data.map(user => 
          `<tr>
            <td>${user.name || ''}</td>
            <td>${user.email || ''}</td>
            <td>${user.phone || ''}</td>
            <td>${user.is_admin ? 'Admin' : 'Member'}</td>
            <td><button class="btn btn-sm btn-outline-secondary">View</button></td>
          </tr>`
        ).join('');
      } else {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center">No users found</td></tr>';
      }
    }, function(error) {
      document.getElementById('usersTableBody').innerHTML = '<tr><td colspan="5" class="text-center text-danger">Failed to load users</td></tr>';
    });
  })();
</script>

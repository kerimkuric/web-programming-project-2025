<div class="view-header d-flex justify-content-between align-items-center">
  <h1>Authors</h1>
  <button class="btn btn-sm btn-outline-primary" id="addAuthorBtn" data-bs-toggle="modal" data-bs-target="#addAuthorModal">Add Author</button>
</div>
<div class="card card-shadow">
  <div class="card-body">
    <div class="table-responsive">
      <table class="table align-middle">
        <thead><tr><th>Name</th><th>Country</th><th></th></tr></thead>
        <tbody id="authorsTableBody">
          <tr><td colspan="3" class="text-center">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<script>
  (function() {
    const user = UserService.getCurrentUser();
    if (user && user.role === Constants.ADMIN_ROLE) {
      document.getElementById('addAuthorBtn').style.display = 'inline-block';
    }
    
    RestClient.get('authors', function(response) {
      const tbody = document.getElementById('authorsTableBody');
      if (response.success && response.data && response.data.length > 0) {
        tbody.innerHTML = response.data.map(author => 
          `<tr>
            <td>${author.name || ''}</td>
            <td>${author.country || ''}</td>
            <td><button class="btn btn-sm btn-outline-secondary">View</button></td>
          </tr>`
        ).join('');
      } else {
        tbody.innerHTML = '<tr><td colspan="3" class="text-center">No authors found</td></tr>';
      }
    }, function() {
      document.getElementById('authorsTableBody').innerHTML = '<tr><td colspan="3" class="text-center text-danger">Failed to load authors</td></tr>';
    });
    
    // Show/hide admin buttons based on user role
    const user = UserService.getCurrentUser();
    if (!user || user.role !== Constants.ADMIN_ROLE) {
      document.getElementById('addAuthorBtn').style.display = 'none';
    }
  })();
</script>

<!-- Add Author Modal -->
<div class="modal fade" id="addAuthorModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add New Author</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="addAuthorForm">
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" name="name" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Country</label>
            <input type="text" class="form-control" name="country" required>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="saveAuthor()">Save Author</button>
      </div>
    </div>
  </div>
</div>

<script>
function saveAuthor() {
  const form = document.getElementById('addAuthorForm');
  const formData = new FormData(form);
  const data = Object.fromEntries(formData);
  
  RestClient.post('authors', data, function(response) {
    if (response.success) {
      toastr.success('Author added successfully!');
      $('#addAuthorModal').modal('hide');
      form.reset();
      window.location.reload();
    } else {
      toastr.error(response.message || 'Failed to add author');
    }
  }, function(error) {
    toastr.error('Error adding author');
  });
}
</script>

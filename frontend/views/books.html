<div class="view-header d-flex justify-content-between align-items-center">
  <h1>Books</h1>
  <button class="btn btn-sm btn-outline-primary" id="addBookBtn" data-bs-toggle="modal" data-bs-target="#addBookModal">Add Book</button>
</div>
<div class="card card-shadow">
  <div class="card-body">
    <div class="input-group mb-3">
      <span class="input-group-text">Search</span>
      <input type="text" class="form-control" id="bookSearch" placeholder="Title, author, ISBN" />
    </div>
    <div class="table-responsive">
      <table class="table align-middle">
        <thead><tr><th>Title</th><th>Author</th><th>Genre</th><th>Year</th><th>ISBN</th><th></th></tr></thead>
        <tbody id="booksTableBody">
          <tr><td colspan="6" class="text-center">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<script>
  (function() {
    // Show/hide admin buttons
    const user = UserService.getCurrentUser();
    if (user && user.role === Constants.ADMIN_ROLE) {
      document.getElementById('addBookBtn').style.display = 'inline-block';
    }
    
    let allBooks = [];
    let allAuthors = [];
    let allGenres = [];
    
    // Load books, authors, and genres
    function loadData() {
      RestClient.get('books', function(response) {
        if (response.success && response.data) {
          allBooks = response.data;
          loadAuthors();
        } else {
          document.getElementById('booksTableBody').innerHTML = '<tr><td colspan="6" class="text-center text-danger">Failed to load books</td></tr>';
        }
      }, function() {
        document.getElementById('booksTableBody').innerHTML = '<tr><td colspan="6" class="text-center text-danger">Failed to load books</td></tr>';
      });
    }
    
    function loadAuthors() {
      RestClient.get('authors', function(response) {
        if (response.success && response.data) {
          allAuthors = response.data;
          loadGenres();
        } else {
          renderBooks();
        }
      }, function() {
        renderBooks();
      });
    }
    
    function loadGenres() {
      RestClient.get('genres', function(response) {
        if (response.success && response.data) {
          allGenres = response.data;
        }
        renderBooks();
      }, function() {
        renderBooks();
      });
    }
    
    function renderBooks(books = allBooks) {
      const tbody = document.getElementById('booksTableBody');
      if (!books || books.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center">No books found</td></tr>';
        return;
      }
      
      tbody.innerHTML = books.map(book => {
        const author = allAuthors.find(a => a.author_id === book.author_id);
        const genre = allGenres.find(g => g.genre_id === book.genre_id);
        return `<tr>
          <td>${book.title || ''}</td>
          <td>${author ? author.name : ''}</td>
          <td>${genre ? genre.name : ''}</td>
          <td>${book.year || ''}</td>
          <td>${book.isbn || ''}</td>
          <td><button class="btn btn-sm btn-outline-secondary">View</button></td>
        </tr>`;
      }).join('');
    }
    
    // Search functionality
    document.getElementById('bookSearch').addEventListener('input', function(e) {
      const searchTerm = e.target.value.toLowerCase();
      if (!searchTerm) {
        renderBooks();
        return;
      }
      const filtered = allBooks.filter(book => {
        const author = allAuthors.find(a => a.author_id === book.author_id);
        return (book.title && book.title.toLowerCase().includes(searchTerm)) ||
               (author && author.name && author.name.toLowerCase().includes(searchTerm)) ||
               (book.isbn && book.isbn.includes(searchTerm));
      });
      renderBooks(filtered);
    });
    
    loadData();
    
    // Show/hide admin buttons based on user role
    const user = UserService.getCurrentUser();
    if (!user || user.role !== Constants.ADMIN_ROLE) {
      document.getElementById('addBookBtn').style.display = 'none';
    }
  })();
</script>

<!-- Add Book Modal -->
<div class="modal fade" id="addBookModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add New Book</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="addBookForm">
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" class="form-control" name="title" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Author ID</label>
            <input type="number" class="form-control" name="author_id" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Genre ID</label>
            <input type="number" class="form-control" name="genre_id" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Year</label>
            <input type="number" class="form-control" name="year" required>
          </div>
          <div class="mb-3">
            <label class="form-label">ISBN</label>
            <input type="text" class="form-control" name="isbn" required>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="saveBook()">Save Book</button>
      </div>
    </div>
  </div>
</div>

<script>
function saveBook() {
  const form = document.getElementById('addBookForm');
  const formData = new FormData(form);
  const data = Object.fromEntries(formData);
  
  // Convert to numbers
  data.author_id = parseInt(data.author_id);
  data.genre_id = parseInt(data.genre_id);
  data.year = parseInt(data.year);
  
  RestClient.post('books', data, function(response) {
    if (response.success) {
      toastr.success('Book added successfully!');
      $('#addBookModal').modal('hide');
      form.reset();
      // Reload the page to show new book
      window.location.reload();
    } else {
      toastr.error(response.message || 'Failed to add book');
    }
  }, function(error) {
    toastr.error('Error adding book');
  });
}
</script>

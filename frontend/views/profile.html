<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card card-shadow">
      <div class="card-body p-4">
        <div class="d-flex align-items-center mb-3">
          <div class="me-3 bg-primary text-white d-flex align-items-center justify-content-center rounded-circle" style="width:56px;height:56px;" id="profileAvatar">U</div>
          <div>
            <h1 class="h5 mb-1">User Profile</h1>
            <div class="text-muted">Member since ${new Date().getFullYear()}</div>
          </div>
        </div>
        <form id="profileForm">
          <div class="row g-3">
            <div class="col-sm-6">
              <label class="form-label">Name <span class="text-danger">*</span></label>
              <input type="text" name="name" id="profileName" class="form-control" required minlength="2" />
            </div>
            <div class="col-sm-6">
              <label class="form-label">Email</label>
              <input type="email" id="profileEmail" class="form-control" disabled />
            </div>
            <div class="col-sm-6">
              <label class="form-label">Phone</label>
              <input type="text" name="phone" id="profilePhone" class="form-control" pattern="^[\+]?[0-9\-\(\)\s]+$" />
            </div>
            <div class="col-sm-6">
              <label class="form-label">Role</label>
              <input type="text" id="profileRole" class="form-control" disabled />
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-primary">Save changes</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  if (!AuthService.isAuthenticated()) {
    window.location.hash = '#/login';
  } else {
    const user = AuthService.getUser();
    if (user && user.name) {
      document.getElementById('profileAvatar').textContent = user.name.charAt(0).toUpperCase();
    }
    UserService.initProfileView();
  }
</script>

<div class="view-header d-flex justify-content-between align-items-center">
  <h1>Borrowings</h1>
  <button class="btn btn-sm btn-outline-primary" id="addBorrowingBtn">New Borrowing</button>
</div>

<div class="card card-shadow mb-4">
  <div class="card-body">
    <h5 class="card-title">Create New Borrowing</h5>
    <form id="borrowingForm">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Book <span class="text-danger">*</span></label>
          <select name="book_id" id="borrowingBook" class="form-select" required></select>
        </div>
        <div class="col-md-6">
          <label class="form-label">User <span class="text-danger">*</span></label>
          <select name="user_id" id="borrowingUser" class="form-select" required></select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Borrow Date <span class="text-danger">*</span></label>
          <input type="date" name="borrow_date" id="borrowingDate" class="form-control" required />
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary">Create Borrowing</button>
        </div>
      </div>
    </form>
  </div>
</div>

<div class="card card-shadow">
  <div class="card-body">
    <div class="table-responsive">
      <table class="table align-middle">
        <thead>
          <tr>
            <th>ID</th>
            <th>Book</th>
            <th>User</th>
            <th>Borrow Date</th>
            <th>Return Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="borrowingsTableBody">
          <tr><td colspan="6" class="text-center">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  if (!AuthService.isAuthenticated()) {
    window.location.hash = '#/login';
  } else {
    // Set default date to today
    const today = new Date().toISOString().split('T')[0];
    const dateInput = document.getElementById('borrowingDate');
    if (dateInput) {
      dateInput.value = today;
    }
    BorrowingService.initBorrowingsView();
  }
</script>

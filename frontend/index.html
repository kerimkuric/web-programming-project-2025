<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Library Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/styles.css" />
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#/dashboard">LMS</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="mainNav">
          <li class="nav-item"><a class="nav-link" href="#/dashboard">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="#/books">Books</a></li>
          <li class="nav-item"><a class="nav-link" href="#/authors">Authors</a></li>
          <li class="nav-item"><a class="nav-link" href="#/genres">Genres</a></li>
          <li class="nav-item admin-only"><a class="nav-link" href="#/users">Users</a></li>
          <li class="nav-item"><a class="nav-link" href="#/borrowings">Borrowings</a></li>
        </ul>
        <ul class="navbar-nav" id="authNav">
          <li class="nav-item" id="loginNav"><a class="nav-link" href="#/login">Login</a></li>
          <li class="nav-item" id="registerNav"><a class="nav-link" href="#/register">Register</a></li>
          <li class="nav-item d-none" id="profileNav"><a class="nav-link" href="#/profile">Profile</a></li>
          <li class="nav-item d-none" id="logoutNav"><a class="nav-link" href="#" id="logoutBtn">Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4" id="app" aria-live="polite"></main>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.17.0/jquery.validate.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.js"></script>
  <script src="./utils/constants.js"></script>
  <script src="./utils/rest-client.js"></script>
  <script src="./utils/utils.js"></script>
  <script src="./services/user-service.js"></script>
  <script src="./assets/js/app.js"></script>
  <script>
    // Update navigation based on auth status
    $(document).ready(function() {
      UserService.init();
      
      function updateNavigation() {
        const token = localStorage.getItem("user_token");
        const isAuth = token && token !== undefined;
        
        if (isAuth) {
          const user = UserService.getCurrentUser();
          const isAdmin = user && user.role === Constants.ADMIN_ROLE;
          
          // Show/hide auth links
          $('#loginNav').hide();
          $('#registerNav').hide();
          $('#profileNav').removeClass('d-none');
          $('#logoutNav').removeClass('d-none');
          
          // Show/hide admin-only links
          $('.admin-only').toggle(isAdmin);
        } else {
          $('#loginNav').show();
          $('#registerNav').show();
          $('#profileNav').addClass('d-none');
          $('#logoutNav').addClass('d-none');
          $('.admin-only').hide();
        }
      }
      
      updateNavigation();
      
      // Logout handler
      $('#logoutBtn').on('click', function(e) {
        e.preventDefault();
        UserService.logout();
      });
      
      // Update navigation on hash change
      $(window).on('hashchange', updateNavigation);
      
      // Check auth on page load
      const protectedRoutes = ['#/dashboard', '#/profile', '#/users'];
      const currentHash = window.location.hash || '#/dashboard';
      const token = localStorage.getItem("user_token");
      
      if (!token && protectedRoutes.some(route => currentHash.startsWith(route))) {
        window.location.hash = '#/login';
      }
    });
  </script>
</body>
</html>
